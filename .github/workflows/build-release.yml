name: Build, Test & Velopack Release (.NET FW 4.8.1)

on:
  push:
    branches: [ "cs4rsa-prism-new-ui" ]
    tags:
      - 'v*' # Chạy quy trình đóng gói khi bạn push tag ví dụ v1.0.3
  pull_request:
    branches: [ "cs4rsa-prism-new-ui" ]

env:
  Solution_Name: cs4rsa.sln
  Test_Project_Path: UnitTestProject\UnitTestProject.csproj

jobs:
  # JOB 1: CHẠY TEST TỰ ĐỘNG
  test:
    name: Run Unit Tests
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Cần cài .NET SDK để có thể dùng lệnh 'dotnet test' thần thánh cho cấu trúc mới
    - name: Install .NET Core SDK (For dotnet test tool)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    # Khôi phục các package từ file packages.config cũ
    - name: Restore NuGet Packages
      run: nuget restore ${{ env.Solution_Name }}

    # Chạy test bằng lệnh 'dotnet test' (Nền tảng Microsoft.Testing.Platform hỗ trợ lệnh này rất tốt)
    - name: Execute unit tests
      run: dotnet test ${{ env.Test_Project_Path }} --configuration ${{ matrix.configuration }} --no-restore

  # JOB 2: ĐÓNG GÓI & RELEASE (Chỉ chạy khi push TAG 'v*')
  release:
    name: Package & Deploy to GitHub Releases
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract Version
      id: get_version
      shell: bash
      run: |
        VERSION=${GITHUB_REF_NAME#v}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v1

    - name: Restore NuGet Packages
      run: nuget restore ${{ env.Solution_Name }}

    - name: Install Velopack
      run: dotnet tool install -g vpk

    # Build dự án WPF bằng MSBuild, ép tên file đầu ra thành Xeplich.exe và xuất ra thư mục .\publish
    - name: Build & Publish App with MSBuild
      run: |
        msbuild Cs4rsa.App\Cs4rsa.App.csproj /p:Configuration=Release /p:Platform=AnyCPU /p:AssemblyName=Xeplich /t:Build /p:OutDir=..\publish\

    # Dùng Velopack đóng gói thư mục .\publish và đẩy lên GitHub Releases
    - name: Velopack Pack & Upload
      run: |
        vpk pack --packId Cs4rsa --packVersion ${{  steps.get_version.outputs.VERSION  }} --packDir .\publish --mainExe Xeplich.exe --title "Xeplich"
        vpk upload github --repoUrl ${{ github.event.repository.html_url }} --token ${{ secrets.GH_TOKEN }} --publish